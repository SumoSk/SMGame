name: Graphics presets verification
on:
  push:
    branches: [graphics-quality-presets-v3]
  workflow_dispatch:
jobs:
  graphics-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --check dist/game.js
      - run: node --check dist/renderer3d.js
      - run: node work/test-graphics-quality.cjs
      - run: node work/test-car-lod-toggle.cjs
      - run: node work/test-car-selection-status.cjs
      - run: node work/test-building-label-toggle.cjs
      - run: npm run build
