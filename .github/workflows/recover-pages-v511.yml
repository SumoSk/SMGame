# One-shot Pages recovery. Does not alter game files or game saves.
name: Recover SMCITY 5.1.1 Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages-v511.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the deployment holding GitHub Pages lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/smcity-cancel-result --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/169cf484c225f691d276ea5e6f3d78c09e92f83b/cancel")"
          echo "Pages cancel response code: ${status}"
          if [[ "${status}" != "204" && "${status}" != "404" ]]; then
            cat /tmp/smcity-cancel-result
            exit 1
          fi
          echo "Stale deployment cancellation processed"
