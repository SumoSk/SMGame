name: Manual vehicle bug reports smoke tests
on:
  push:
    branches:
      - test/vehicle-bug-reports-final-2026-10-30
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node work/build-member.cjs
      - run: node --check dist/game.js
      - run: node --check work/member-entry.js
      - run: node -r ./work/test-dom-compat.cjs work/test-manual-vehicle-bug-reports.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-adaptive-traffic.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-lane-change-safety.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-traffic-fixes.cjs
