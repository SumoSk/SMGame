name: SMCITY 5.3 resident missions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  resident-missions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/game.js
      - run: node -r ./work/test-dom-compat.cjs work/test-resident-mission-rules.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-schedule-diagnostics.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-v251-schedule.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-v500.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-travel-happiness.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-lifestyles.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-mission-dashboard.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-tourism.cjs

