name: London showcase smoke
permissions:
  contents: write
on:
  push:
    branches:
      - feature/london-showcase-city
  workflow_dispatch:
jobs:
  london-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check dist/game.js
      - run: node -r ./work/test-dom-compat.cjs work/test-london-showcase.cjs
      - name: Build release and invalidate cached assets
        run: npm run build
      - name: Commit compiled website and standalone demo to feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/bootstrap.js dist/index.html dist/qa.html dist/qa-tourism.html dist/member.js dist/style.css outputs/Traffic-Fixer-Thailand-3D.html
          if ! git diff --cached --quiet; then
            git commit -m "build: compile SMCITY 4.4.4 London release and refresh asset hashes"
            git push origin HEAD:feature/london-showcase-city
          fi
