name: London showcase smoke
on:
  push:
    branches:
      - feature/london-showcase-city
  workflow_dispatch:
jobs:
  london-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check dist/game.js
      - run: node -r ./work/test-dom-compat.cjs work/test-london-showcase.cjs
