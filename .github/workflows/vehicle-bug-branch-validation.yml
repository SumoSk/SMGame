name: Vehicle bug-report branch validation and member build
on:
  push:
    branches:
      - feature/manual-vehicle-bug-reports-2026-10-30
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node work/build-member.cjs
      - run: node --check dist/game.js
      - run: node --check work/member-entry.js
      - run: node -r ./work/test-dom-compat.cjs work/test-manual-vehicle-bug-reports.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-adaptive-traffic.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-lane-change-safety.cjs
      - run: |
          if ! git diff --quiet -- dist/member.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/member.js
            git commit -m "build: regenerate member bundle for manual vehicle bug reports"
            git push origin HEAD:feature/manual-vehicle-bug-reports-2026-10-30
          fi
