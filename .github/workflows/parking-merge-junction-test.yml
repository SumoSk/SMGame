name: Parking-merge junction deadlock patch checks
on:
  push:
    branches:
      - test/parking-merge-junction-2026-10-30
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/game.js
      - run: node work/test-parking-junction-claims.cjs
      - run: node work/test-parking-merge.cjs
      - run: node work/test-parking-emergency.cjs
      - run: node work/test-green-light-release.cjs
      - run: node work/test-traffic-fixes.cjs
      - run: node work/test-lane-change-safety.cjs
