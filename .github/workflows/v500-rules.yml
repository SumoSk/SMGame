name: SMCITY 5.0 rules
on:
  push:
    branches: [version-5.0, main]
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/game.js && node --check dist/renderer3d.js
      - run: node -r ./work/test-dom-compat.cjs work/test-travel-happiness.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-mission-dashboard.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-v500.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-v500-civic-model.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-lifestyles.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-tourism.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-saves.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-night-delivery.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-green-light-release.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-flight-traffic-layer.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-london-showcase.cjs

