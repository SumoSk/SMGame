name: Parking merge baseline check
on:
  push:
    branches:
      - test/parking-merge-baseline-2026-10-30
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node -r ./work/test-dom-compat.cjs work/test-parking-merge.cjs
