name: SMCITY 4.4.6 green-light release checks
on:
  push:
    branches:
      - fix/green-direct-v4.4.6-2026-10-29
  pull_request:
    paths:
      - dist/game.js
      - work/test-green-light-release.cjs
      - .github/workflows/green-light-release.yml
permissions:
  contents: write
jobs:
  green-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check dist/game.js
      - run: node -r ./work/test-dom-compat.cjs work/test-green-light-release.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-signal-queue-optimization.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-lane-signals.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-traffic-fixes.cjs
      - run: npm run build
      - name: Commit versioned website and offline build on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/green-direct-v4.4.6-2026-10-29'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/bootstrap.js dist/index.html dist/qa.html dist/qa-tourism.html outputs/Traffic-Fixer-Thailand-3D.html
          if ! git diff --cached --quiet; then
            git commit -m "build: compile SMCITY 4.4.6 green light release"
            git push origin HEAD:fix/green-direct-v4.4.6-2026-10-29
          fi
