name: SMGame regressions
on:
  push:
    branches:
      - main
      - feature/smcity-1.4-landscaping-20261022
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check dist/game.js
      - run: node --check dist/renderer3d.js
      - run: npm test
      - run: npm run test:tourism
      - run: npm run build
