name: Starter showcase verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  starter-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check dist/game.js
      - run: node -r ./work/test-dom-compat.cjs work/test-starter-showcase.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-emigration-40.cjs
      - run: node work/test-city-notice.cjs
