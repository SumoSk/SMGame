name: One-block lane-change validation
on:
  push:
    branches:
      - test/lane-one-block-validation-2026-10-30
permissions:
  contents: read
jobs:
  lane-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/game.js
      - run: node -r ./work/test-dom-compat.cjs work/test-motion.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-adaptive-traffic.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-lane-change-safety.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-traffic-fixes.cjs
