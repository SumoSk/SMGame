name: Checkpoint and night graphics regression
on:
  push:
    branches: [feature/checkpoint-night-v451]
  pull_request:
    paths:
      - 'dist/renderer3d.js'
      - 'work/test-checkpoint-night.cjs'
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/game.js
      - run: node --check dist/renderer3d.js
      - run: node -r ./work/test-dom-compat.cjs work/test-checkpoint-night.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-terrain-materials.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-factory-night-effects.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-graphics-quality.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-flight-traffic-layer.cjs
      - run: node -r ./work/test-dom-compat.cjs work/test-right-turn-exit-clearance.cjs
